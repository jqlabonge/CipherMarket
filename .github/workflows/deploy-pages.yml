name: Deploy frontend to GitHub Pages

# Publishes the frontend/ folder as a live static site any time it changes on
# main. No build step -- index.html is served as-is (ethers.js loads from a
# CDN at runtime in the browser), so this just hands the folder to Pages.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: # lets you manually trigger a re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true # auto-creates the Pages "site" on the repo if it
                            # doesn't exist yet -- without this, the very first
                            # run 404s looking for a site that was never
                            # actually created, even with Source set to
                            # "GitHub Actions" in the Settings UI.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
